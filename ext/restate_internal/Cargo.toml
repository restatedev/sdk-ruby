[package]
name = "restate_internal"
version = "1.3.1"
edition = "2024"
publish = false

[lib]
name = "restate_internal"
crate-type = ["cdylib"]
doc = false

[dependencies]
magnus = { version = "0.9", features = ["rb-sys"] }
rb-sys = { version = "0.9", features = ["stable-api-compiled-fallback"] }
restate-sdk-shared-core = { version = "8.7.1", features = ["request_identity", "sha2_random_seed", "rust_crypto"] }
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
